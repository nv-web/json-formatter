<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JSONify is a fast, private, client-side JSON formatter, validator, beautifier, and minifier with tree view and statistics."
    />
    <meta name="theme-color" content="#070a10" />
    <title>JSONify — Format, Validate & Minify JSON</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('jsonify-theme')
          var dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
